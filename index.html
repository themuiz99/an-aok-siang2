<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMuiz อ่านออกเสียง</title>
    <!-- Load Tailwind CSS for styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Scripts for ResponsiveVoice -->
    <script id="voice-female" src="https://code.responsivevoice.org/responsivevoice.js?key=Negu9VLC"></script>
    <script id="voice-male" src="https://code.responsivevoice.org/responsivevoice.js?key=6uRDqcc4"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            overflow: hidden;
        }
        #statusMessage {
            min-height: 1.5rem;
        }
        #speechText {
            max-height: 35vh;
            overflow-y: auto;
            flex-grow: 1;
        }
        .main-content-area {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 28rem;
        }
        .option-btn.active {
            border-color: #3b82f6;
            background-color: #1e3a8a;
            color: white;
        }
        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <header class="text-center mb-4 mt-4">
        <h1 class="text-5xl font-extrabold text-white mb-2">TheMuiz</h1>
        <h2 class="text-3xl font-semibold text-white">อ่านออกเสียง</h2>
    </header>

    <div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-full main-content-area">
        <div class="relative w-full mb-4">
            <textarea
                id="speechText"
                class="w-full p-4 pb-7 bg-gray-700 text-white rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                rows="5"
                placeholder="พิมพ์ข้อความที่นี่เลยค่ะ..."
            ></textarea>
            <span id="charCount" class="absolute bottom-2 right-3 text-xs text-gray-400 pointer-events-none">0</span>
        </div>

        <!-- Voice Selection Area -->
        <div class="w-full mb-4">
            <p class="text-xs text-gray-400 mb-1 text-center">เลือกเสียง:</p>
            <div class="flex space-x-2">
                <button id="selectFemale" class="option-btn active flex-1 py-2 px-2 rounded-lg border border-gray-600 bg-gray-700 text-xs transition-all">👩 เสียงผู้หญิง</button>
                <button id="selectMale" class="option-btn flex-1 py-2 px-2 rounded-lg border border-gray-600 bg-gray-700 text-xs transition-all">👨 เสียงผู้ชาย</button>
            </div>
        </div>

        <!-- Speed Selection Area -->
        <div class="w-full mb-6">
            <p class="text-xs text-gray-400 mb-1 text-center">ความเร็วการอ่าน:</p>
            <div class="flex space-x-2">
                <button id="speedSlow" class="option-btn flex-1 py-2 px-2 rounded-lg border border-gray-600 bg-gray-700 text-xs transition-all">ช้า</button>
                <button id="speedNormal" class="option-btn active flex-1 py-2 px-2 rounded-lg border border-gray-600 bg-gray-700 text-xs transition-all">ปกติ</button>
                <button id="speedFast" class="option-btn flex-1 py-2 px-2 rounded-lg border border-gray-600 bg-gray-700 text-xs transition-all">เร็ว</button>
            </div>
        </div>

        <div class="text-center w-full mb-6 flex justify-center items-center">
            <div id="loadingIcon" class="loader"></div>
            <p id="statusMessage" class="text-gray-400 text-sm m-0">พร้อมใช้งาน</p>
        </div>

        <!-- Button Controls -->
        <div class="flex flex-col space-y-4 w-full">
            <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 w-full">
                <button id="speakButton" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:scale-105">อ่านออกเสียงเลย!</button>
                <button id="pauseButton" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:scale-105">หยุดพัก/อ่านต่อ</button>
            </div>
            
            <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 w-full">
                <button id="downloadButton" class="flex-[2] bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:scale-105 relative overflow-hidden">
                    💾 บันทึกไฟล์เสียง
                    <!-- หลอดเปอร์เซ็นต์โหลดอยู่หลังข้อความ -->
                    <div id="downloadProgress" class="absolute left-0 bottom-0 h-1 bg-green-300 w-0 transition-all duration-300"></div>
                </button>
                <button id="clearButton" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:scale-105">ล้างข้อความ</button>
            </div>
        </div>
    </div>

    <footer class="mt-4 mb-4 text-gray-500 text-sm">
        Creator: TheMuiz × หนูมะลิ
    </footer>

    <script>
        function filterTextToSpeak(text) {
            return text.replace(/[^ก-๙a-zA-Z0-9\s\n]/g, '');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const speechText = document.getElementById('speechText');
            const charCount = document.getElementById('charCount');
            const speakButton = document.getElementById('speakButton');
            const pauseButton = document.getElementById('pauseButton');
            const downloadButton = document.getElementById('downloadButton');
            const clearButton = document.getElementById('clearButton');
            const statusMessage = document.getElementById('statusMessage');
            const loadingIcon = document.getElementById('loadingIcon');
            const downloadProgress = document.getElementById('downloadProgress');
            
            const btnFemale = document.getElementById('selectFemale');
            const btnMale = document.getElementById('selectMale');
            const btnSlow = document.getElementById('speedSlow');
            const btnNormal = document.getElementById('speedNormal');
            const btnFast = document.getElementById('speedFast');
            
            let selectedVoice = 'Thai Female';
            let currentRate = 1;
            let isPaused = false;
            let currentTextArray = [];
            let currentIndex = 0;

            // ตัวแปรสำหรับเช็คว่ากำลังดาวน์โหลดอยู่ไหม จะได้ไม่กดซ้ำ
            let isDownloading = false;

            // อัปเดตจำนวนตัวอักษร
            speechText.addEventListener('input', () => {
                charCount.textContent = speechText.value.length;
            });

            function updateUI(activeBtn, otherBtns) {
                activeBtn.classList.add('active');
                otherBtns.forEach(btn => btn.classList.remove('active'));
            }

            function stopSpeaking(resetIndex = true) {
                if (typeof responsiveVoice !== 'undefined') responsiveVoice.cancel();
                if (resetIndex) {
                    isPaused = false;
                    currentIndex = 0;
                }
            }

            // เลือกเสียงและความเร็ว (เหมือนเดิม)
            btnFemale.addEventListener('click', () => { selectedVoice = 'Thai Female'; updateUI(btnFemale, [btnMale]); stopSpeaking(false); });
            btnMale.addEventListener('click', () => { selectedVoice = 'Thai Male'; updateUI(btnMale, [btnFemale]); stopSpeaking(false); });
            btnSlow.addEventListener('click', () => { currentRate = 0.7; updateUI(btnSlow, [btnNormal, btnFast]); stopSpeaking(false); });
            btnNormal.addEventListener('click', () => { currentRate = 1; updateUI(btnNormal, [btnSlow, btnFast]); stopSpeaking(false); });
            btnFast.addEventListener('click', () => { currentRate = 1.2; updateUI(btnFast, [btnSlow, btnNormal]); stopSpeaking(false); });

            function playFromIndex(index) {
                if (index >= currentTextArray.length) {
                    statusMessage.textContent = 'อ่านจบแล้วค่ะ!';
                    isPaused = false;
                    currentIndex = 0;
                    return;
                }
                currentIndex = index;
                responsiveVoice.speak(currentTextArray[currentIndex], selectedVoice, {
                    rate: currentRate,
                    onend: () => { 
                        if (!isPaused) playFromIndex(currentIndex + 1);
                    }
                });
            }

            // ฟังสด (เหมือนเดิม)
            speakButton.addEventListener('click', () => {
                if (isDownloading) return; // ถ้าโหลดไฟล์อยู่ ห้ามกดฟังสดเดี๋ยวระบบชนกัน
                if (typeof responsiveVoice === 'undefined') return;
                const filteredText = filterTextToSpeak(speechText.value.trim());
                if (!filteredText) { statusMessage.textContent = 'กรุณาพิมพ์ข้อความก่อนนะจ๊ะ!'; return; }

                currentTextArray = filteredText.split(/([。！？.!?\n])/).filter(s => s.trim().length > 0);
                if (currentTextArray.length === 0) currentTextArray = [filteredText];

                stopSpeaking();
                statusMessage.textContent = 'กำลังอ่านออกเสียง...';
                playFromIndex(0);
            });

            pauseButton.addEventListener('click', () => {
                if (isDownloading) return;
                if (typeof responsiveVoice === 'undefined' || currentTextArray.length === 0) return;
                if (responsiveVoice.isPlaying()) {
                    responsiveVoice.cancel();
                    isPaused = true;
                    statusMessage.textContent = 'หยุดพักแล้วค่ะ';
                } else if (isPaused) {
                    isPaused = false;
                    statusMessage.textContent = 'กำลังอ่านต่อค่ะ...';
                    playFromIndex(currentIndex);
                }
            });

            // ฟังก์ชันหั่นข้อความยาวๆ เป็นท่อนเล็กๆ ท่อนละไม่เกิน maxLen ตัวอักษร
            function chunkText(text, maxLen) {
                // แบ่งตามการเว้นบรรทัดหรือช่องว่างก่อน เพื่อไม่ให้คำขาดกลาง
                const words = text.split(/([\s\n]+)/); 
                const chunks = [];
                let currentChunk = '';

                for (let word of words) {
                    if ((currentChunk + word).length > maxLen) {
                        chunks.push(currentChunk);
                        currentChunk = word;
                    } else {
                        currentChunk += word;
                    }
                }
                if (currentChunk.trim().length > 0) chunks.push(currentChunk);
                return chunks.filter(c => c.trim().length > 0);
            }

            // ปุ่มดาวน์โหลด (อัปเกรดใหม่ รวมไฟล์ได้)
            downloadButton.addEventListener('click', async () => {
                if (isDownloading) return; // ป้องกันกดซ้ำตอนมันกำลังโหลด

                const rawText = speechText.value.trim();
                const filteredText = filterTextToSpeak(rawText);
                if (!filteredText) { 
                    statusMessage.textContent = 'พิมพ์ข้อความก่อนนะคะ!'; 
                    return; 
                }

                stopSpeaking(); // หยุดเสียงที่กำลังเล่นอยู่ก่อน
                isDownloading = true;
                downloadButton.classList.add('opacity-50', 'cursor-not-allowed');
                loadingIcon.style.display = 'inline-block';
                downloadProgress.style.width = '0%';

                // หั่นข้อความ ท่อนละไม่เกิน 600 ตัว (เผื่อเซฟไว้ก่อน กัน URL พัง)
                const chunks = chunkText(filteredText, 600);
                const totalChunks = chunks.length;
                statusMessage.textContent = `ข้อความยาวมาก ต้องแบ่งเย็บทั้งหมด ${totalChunks} ส่วน...`;
                
                const apiKey = selectedVoice === 'Thai Female' ? 'Negu9VLC' : '6uRDqcc4';
                let allBlobs = []; // ตะกร้าเก็บไฟล์เสียงแต่ละท่อน

                try {
                    // วนลูปขอดาวน์โหลดทีละท่อน
                    for (let i = 0; i < totalChunks; i++) {
                        statusMessage.textContent = `กำลังโหลดและเย็บส่วนที่ ${i + 1} จาก ${totalChunks} ...`;
                        downloadProgress.style.width = `${((i + 1) / totalChunks) * 100}%`;
                        
                        const url = `https://code.responsivevoice.org/getvoice.php?t=${encodeURIComponent(chunks[i])}&tl=th&sv=&vn=${encodeURIComponent(selectedVoice)}&pitch=0.5&rate=${currentRate}&vol=1&key=${apiKey}`;
                        
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('โหลด API พลาด');
                        
                        const blob = await response.blob();
                        allBlobs.push(blob); // เอาไฟล์ท่อนย่อยใส่ตะกร้า

                        // พักหายใจ 0.5 วินาทีระหว่างท่อน ป้องกัน API บล็อกเพราะเราส่งรัวเกินไป
                        await new Promise(r => setTimeout(r, 500)); 
                    }

                    statusMessage.textContent = 'กำลังมัดรวมเป็นไฟล์เดียว...';

                    // เอาไฟล์ในตะกร้าทั้งหมดมาต่อกันเป็นไฟล์ก้อนใหญ่ (เย็บติดกัน)
                    const finalBlob = new Blob(allBlobs, { type: 'audio/mpeg' });
                    const blobUrl = window.URL.createObjectURL(finalBlob);
                    
                    // สั่งดาวน์โหลด
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `TheMuiz_Audio_${Date.now()}.mp3`;
                    document.body.appendChild(a);
                    a.click();
                    
                    window.URL.revokeObjectURL(blobUrl);
                    statusMessage.textContent = 'เสร็จเรียบร้อย! โหลดไฟล์รวมสำเร็จ 🎉';

                } catch (error) {
                    console.error(error);
                    statusMessage.textContent = 'เกิดข้อผิดพลาดในการโหลด อาจจะติด Limit ลองแบ่งข้อความให้สั้นลงนิดนึงนะคะ';
                } finally {
                    // คืนสถานะปุ่มให้กลับมากดได้เหมือนเดิม
                    isDownloading = false;
                    downloadButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    loadingIcon.style.display = 'none';
                    setTimeout(() => { downloadProgress.style.width = '0%'; }, 2000); // ซ่อนหลอดเปอร์เซ็นต์
                }
            });

            clearButton.addEventListener('click', () => { 
                if (isDownloading) return;
                stopSpeaking(); 
                speechText.value = ''; 
                charCount.textContent = '0';
                statusMessage.textContent = 'ล้างข้อความเรียบร้อยค่ะ'; 
            });
        });
    </script>
</body>
</html>
